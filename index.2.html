<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浚鍵管理 - 小巴行車報表一鍵轉檔系統 (八達通/現金分拆對數版)</title>
    
    <!-- 引入核心庫 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

    <style>
        :root {
            --primary: #1F497D;
            --primary-hover: #16365C;
            --green: #2E8540;
            --green-hover: #236932;
            --orange: #B25900;
            --bg: #F4F6F9;
            --card: #FFFFFF;
            --text: #2C3E50;
            --border: #DCE2E6;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 12px;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            background: var(--card);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #EEF2F7;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 6px 0;
            font-size: 22px;
        }

        .header p {
            margin: 0;
            color: #6C7A89;
            font-size: 13px;
        }

        .upload-card {
            background: #F8FAFD;
            border: 2px dashed #B0C4DE;
            border-radius: 10px;
            padding: 26px 16px;
            text-align: center;
            margin-bottom: 18px;
            transition: all 0.2s;
        }

        .upload-card.dragover {
            border-color: var(--primary);
            background: #EDF3FA;
        }

        .btn-main {
            background: var(--primary);
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            padding: 13px 28px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn-main:hover { background: var(--primary-hover); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            color: #8C9BAE;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider:not(:empty)::before { margin-right: .6em; }
        .divider:not(:empty)::after { margin-left: .6em; }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 12px;
            box-sizing: border-box;
            resize: vertical;
        }

        .stats-grid {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-box {
            background: #F8FAFD;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            text-align: center;
        }

        .stat-box .lbl {
            font-size: 12px;
            color: #6C7A89;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .stat-box .val {
            font-size: 20px;
            font-weight: bold;
        }

        .table-preview-wrap {
            display: none;
            margin-top: 24px;
            overflow-x: auto;
        }

        .table-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table.preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: center;
        }

        table.preview-table th {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px 8px;
            border: 1px solid #B0C4DE;
        }

        table.preview-table td {
            padding: 8px 6px;
            border: 1px solid #DCE2E6;
        }

        table.preview-table tr:nth-child(even) {
            background-color: #F9FAFB;
        }

        table.preview-table tr.total-row {
            background-color: #FFF2CC;
            font-weight: bold;
        }

        .btn-grid {
            display: none;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .btn-export {
            flex: 1;
            min-width: 220px;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.2s;
        }

        .btn-export-zip { background: var(--primary); }
        .btn-export-zip:hover { background: var(--primary-hover); }
        .btn-export-xlsx { background: var(--green); }
        .btn-export-xlsx:hover { background: var(--green-hover); }

        .status-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
        }
        .status-info { background: #E8F4FD; color: #0D6EFD; }
        .status-success { background: #E6F7ED; color: #198754; font-weight: bold; }
        .status-error { background: #FDE8E8; color: #DC3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚌 浚鍵管理 - 小巴行車報表一鍵轉檔系統</h1>
        <p>八達通 9元/6元 與 現金 9元/6元 獨立分拆明細・實時對數結算</p>
    </div>

    <!-- 上傳按鈕區 -->
    <div class="upload-card" id="dropzone">
        <input type="file" id="fileInput" accept=".csv,text/csv" style="display:none;" onchange="handleFileInput(this)">
        <button type="button" class="btn-main" onclick="triggerFileInput()">
            📂 點擊選擇 CSV 檔案 (最推薦)
        </button>
        <div style="color:#6C7A89; font-size:12px; margin-top:8px;">或將 CSV 檔案直接拖放至此框內</div>
    </div>

    <div class="divider">或者 直接在下方貼上 CSV 文字</div>

    <textarea id="csvText" placeholder="在此處貼上 CSV 內容（例如從記事本或 Excel 複製的資料）..."></textarea>
    <button type="button" class="btn-main" style="margin-top:8px; width:100%;" onclick="handleTextParse()">
        ⚡ 解析貼上的 CSV 文字
    </button>

    <!-- 全月總覽統計卡片 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-box">
            <div class="lbl">涵蓋天數</div>
            <div class="val" id="statDays" style="color:var(--primary);">0 日</div>
        </div>
        <div class="stat-box">
            <div class="lbl">總班次</div>
            <div class="val" id="statTrips" style="color:var(--primary);">0 班</div>
        </div>
        <div class="stat-box">
            <div class="lbl">💳 八達通總收入 (自動入賬)</div>
            <div class="val" id="statOctopus" style="color:#1F497D;">$0</div>
        </div>
        <div class="stat-box">
            <div class="lbl">💵 現金總收入 (司機交收)</div>
            <div class="val" id="statCash" style="color:#B25900;">$0</div>
        </div>
        <div class="stat-box">
            <div class="lbl">💰 全車總營業額</div>
            <div class="val" id="statRevenue" style="color:#2E8540;">$0</div>
        </div>
    </div>

    <!-- 每日實時核對明細表格 (直接在網頁上顯示) -->
    <div class="table-preview-wrap" id="tablePreviewWrap">
        <div class="table-title">
            <span>📋 每日營運及對數實時清單 (八達通 vs 現金)</span>
        </div>
        <table class="preview-table" id="previewTable">
            <thead>
                <tr>
                    <th>營運日期</th>
                    <th>車牌</th>
                    <th>早更司機</th>
                    <th>夜更司機</th>
                    <th>總班次</th>
                    <th style="background:#1F497D;">💳 八達通收入</th>
                    <th style="background:#B25900;">💵 現金收入 (司機交收)</th>
                    <th style="background:#2E8540;">💰 當日總營業額</th>
                </tr>
            </thead>
            <tbody id="previewTbody">
            </tbody>
        </table>
    </div>

    <!-- 匯出按鈕 -->
    <div class="btn-grid" id="btnGrid">
        <button type="button" class="btn-export btn-export-zip" onclick="exportZipFiles()">
            📦 一鍵下載每日獨立 Excel (.zip)
        </button>
        <button type="button" class="btn-export btn-export-xlsx" onclick="exportMonthlyWorkbook()">
            📑 下載全月多分頁整合 Excel (.xlsx)
        </button>
    </div>

    <!-- 狀態通知 -->
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
let parsedRows = [];
let dateGroups = {};

function triggerFileInput() {
    const input = document.getElementById('fileInput');
    input.value = ''; 
    input.click();
}

window.addEventListener('dragover', (e) => e.preventDefault(), false);
window.addEventListener('drop', (e) => e.preventDefault(), false);

const dropArea = document.getElementById('dropzone');
['dragenter', 'dragover'].forEach(evt => {
    dropArea.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropArea.classList.add('dragover'); }, false);
});
['dragleave', 'drop'].forEach(evt => {
    dropArea.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); dropArea.classList.remove('dragover'); }, false);
});
dropArea.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    dropArea.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        parseCSVFile(e.dataTransfer.files[0]);
    }
});

function handleFileInput(inputElement) {
    if (inputElement.files && inputElement.files.length > 0) {
        parseCSVFile(inputElement.files[0]);
    }
}

function parseCSVFile(file) {
    showNotice('正在讀取檔案：' + file.name + ' ...', 'info');

    if (typeof Papa === 'undefined') {
        showNotice('❌ 無法載入解析庫，請確認電腦有連接網絡！', 'error');
        return;
    }

    Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
            processData(res.data);
        },
        error: function(err) {
            showNotice('檔案讀取錯誤：' + err.message, 'error');
        }
    });
}

function handleTextParse() {
    const text = document.getElementById('csvText').value.trim();
    if (!text) {
        alert('請先在文字框中貼上 CSV 內容！');
        return;
    }
    showNotice('正在解析貼上的文字...', 'info');
    const res = Papa.parse(text, { header: true, skipEmptyLines: true });
    processData(res.data);
}

function getField(row, keyNames) {
    if (!Array.isArray(keyNames)) keyNames = [keyNames];
    const rowKeys = Object.keys(row);
    for (const k of rowKeys) {
        const cleanK = k.replace(/[\uFEFF\u0000]/g, '').trim();
        for (const target of keyNames) {
            if (cleanK === target || cleanK.includes(target)) {
                return (row[k] !== undefined && row[k] !== null) ? String(row[k]).trim() : '';
            }
        }
    }
    return '';
}

function processData(rawData) {
    if (!rawData || rawData.length === 0) {
        showNotice('❌ 未找到有效數據，請檢查 CSV 內容！', 'error');
        return;
    }

    parsedRows = rawData.map(r => {
        const d = getField(r, ['日期', 'Date', 'date']);
        const plate = getField(r, ['車牌', 'Plate', 'plate']);
        const mDrv = getField(r, ['早更司機', '早更']);
        const nDrv = getField(r, ['夜更司機', '夜更']);
        const shift = getField(r, ['更次', '更份', 'Shift', 'shift']);
        const time = getField(r, ['開出時間', '時間', 'Time', 'time']);
        const dest = getField(r, ['目的地', '方向', 'Route', 'dest']);
        const oct9 = Number(getField(r, ['八達通9元', '八達通9']) || 0);
        const oct6 = Number(getField(r, ['八達通6元', '八達通6']) || 0);
        const cash9 = Number(getField(r, ['現金9元', '現金9']) || 0);
        const cash6 = Number(getField(r, ['現金6元', '現金6']) || 0);

        return {
            date: d,
            plate: plate,
            morningDriver: mDrv,
            nightDriver: nDrv,
            shift: shift,
            time: time,
            destination: dest,
            oct9: oct9,
            oct6: oct6,
            cash9: cash9,
            cash6: cash6
        };
    }).filter(r => r.date !== '');

    if (parsedRows.length === 0) {
        showNotice('❌ CSV 中找不到「日期」欄位，請確認檔案格式！', 'error');
        return;
    }

    dateGroups = {};
    let sumOctopus = 0;
    let sumCash = 0;

    parsedRows.forEach(item => {
        if (!dateGroups[item.date]) dateGroups[item.date] = [];
        dateGroups[item.date].push(item);
        sumOctopus += (item.oct9 * 9 + item.oct6 * 6);
        sumCash += (item.cash9 * 9 + item.cash6 * 6);
    });

    const dates = Object.keys(dateGroups).sort();

    // 更新頂部卡片
    document.getElementById('statDays').innerText = `${dates.length} 日`;
    document.getElementById('statTrips').innerText = `${parsedRows.length} 班`;
    document.getElementById('statOctopus').innerText = `$${sumOctopus.toLocaleString()}`;
    document.getElementById('statCash').innerText = `$${sumCash.toLocaleString()}`;
    document.getElementById('statRevenue').innerText = `$${(sumOctopus + sumCash).toLocaleString()}`;

    // 渲染網頁預覽表格
    const tbody = document.getElementById('previewTbody');
    tbody.innerHTML = '';

    dates.forEach(d => {
        const grp = dateGroups[d];
        const plate = grp[0].plate || '-';
        const mDrv = grp.find(t => t.shift === '早更' && t.morningDriver)?.morningDriver || grp[0].morningDriver || '-';
        const nDrv = grp.find(t => t.shift === '夜更' && t.nightDriver)?.nightDriver || grp[0].nightDriver || '-';
        
        let dOct = 0, dCash = 0;
        grp.forEach(t => {
            dOct += (t.oct9 * 9 + t.oct6 * 6);
            dCash += (t.cash9 * 9 + t.cash6 * 6);
        });

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${d}</strong></td>
            <td>${plate}</td>
            <td>${mDrv}</td>
            <td>${nDrv}</td>
            <td>${grp.length} 班</td>
            <td style="color:#1F497D; font-weight:bold;">$${dOct.toLocaleString()}</td>
            <td style="color:#B25900; font-weight:bold;">$${dCash.toLocaleString()}</td>
            <td style="color:#2E8540; font-weight:bold;">$${(dOct + dCash).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
    });

    // 總計列
    const trTot = document.createElement('tr');
    trTot.className = 'total-row';
    trTot.innerHTML = `
        <td><strong>合計</strong></td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>${parsedRows.length} 班</td>
        <td style="color:#1F497D; font-size:15px;">$${sumOctopus.toLocaleString()}</td>
        <td style="color:#B25900; font-size:15px;">$${sumCash.toLocaleString()}</td>
        <td style="color:#2E8540; font-size:15px;">$${(sumOctopus + sumCash).toLocaleString()}</td>
    `;
    tbody.appendChild(trTot);

    document.getElementById('statsGrid').style.display = 'grid';
    document.getElementById('tablePreviewWrap').style.display = 'block';
    document.getElementById('btnGrid').style.display = 'flex';
    showNotice(`✅ 成功載入 ${dates.length} 日（共 ${parsedRows.length} 班車）！八達通與現金收入已實時計算列出。`, 'success');
}
function populateDailySheet(ws, dateKey, trips) {
    ws.views = [{ showGridLines: true }];

    const plate = trips[0].plate || '';
    const morningDriver = trips.find(t => t.shift === '早更' && t.morningDriver)?.morningDriver || trips[0].morningDriver || '';
    const nightDriver = trips.find(t => t.shift === '夜更' && t.nightDriver)?.nightDriver || trips[0].nightDriver || '';

    // 計算當日實際數值 (用於直接預填 result，確保任何閱讀器都看得到)
    let leftOct9 = 0, leftOct6 = 0, leftCash9 = 0, leftCash6 = 0;
    let rightOct9 = 0, rightOct6 = 0, rightCash9 = 0, rightCash6 = 0;

    const leftData = trips.filter(t => t.destination.includes('元朗'));
    const rightData = trips.filter(t => t.destination.includes('大棠') || t.destination.includes('黃泥墩'));

    leftData.forEach(t => { leftOct9 += t.oct9; leftOct6 += t.oct6; leftCash9 += t.cash9; leftCash6 += t.cash6; });
    rightData.forEach(t => { rightOct9 += t.oct9; rightOct6 += t.oct6; rightCash9 += t.cash9; rightCash6 += t.cash6; });

    const totalOctopusRev = (leftOct9 + rightOct9) * 9 + (leftOct6 + rightOct6) * 6;
    const totalCashRev = (leftCash9 + rightCash9) * 9 + (leftCash6 + rightCash6) * 6;
    const totalPassengers = (leftOct9 + leftOct6 + leftCash9 + leftCash6) + (rightOct9 + rightOct6 + rightCash9 + rightCash6);
    const grandTotalRev = totalOctopusRev + totalCashRev;

    // 1. 標題行
    ws.mergeCells('A1:M1');
    ws.getCell('A1').value = "浚鍵管理有限公司";
    ws.getCell('A1').font = { name: "Microsoft JhengHei", size: 16, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell('A1').alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells('A2:M2');
    ws.getCell('A2').value = "紅色小巴班次記錄表 (八達通 / 現金 分拆對數表)";
    ws.getCell('A2').font = { name: "Microsoft JhengHei", size: 12, bold: true, color: { argb: "FF2C3E50" } };
    ws.getCell('A2').alignment = { horizontal: 'center', vertical: 'middle' };

    // 2. 車牌司機資訊
    ws.getCell('A3').value = "日期 :"; ws.getCell('B3').value = dateKey;
    ws.getCell('D3').value = "車牌號碼 :"; ws.getCell('E3').value = plate;
    ws.getCell('H3').value = "早更司機 :"; ws.getCell('H3').font = { name: "Microsoft JhengHei", size: 10, bold: true };
    ws.getCell('I3').value = morningDriver;
    ws.getCell('H4').value = "夜更司機 :"; ws.getCell('H4').font = { name: "Microsoft JhengHei", size: 10, bold: true };
    ws.getCell('I4').value = nightDriver;

    ['A3','B3','D3','E3','H3','I3','H4','I4'].forEach(pos => {
        ws.getCell(pos).font = { name: "Microsoft JhengHei", size: 10, bold: true };
    });

    // 3. 路線大標題 (Row 6)
    ws.mergeCells('A6:F6');
    ws.getCell('A6').value = "去 西鐵 元朗站";
    ws.getCell('A6').font = { name: "Microsoft JhengHei", size: 11, bold: true, color: { argb: "FFFFFFFF" } };
    ws.getCell('A6').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FF1F497D" } };
    ws.getCell('A6').alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells('H6:M6');
    ws.getCell('H6').value = "去 大棠 黃泥墩";
    ws.getCell('H6').font = { name: "Microsoft JhengHei", size: 11, bold: true, color: { argb: "FFFFFFFF" } };
    ws.getCell('H6').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FF1E7E34" } };
    ws.getCell('H6').alignment = { horizontal: 'center', vertical: 'middle' };

    // 4. 欄位標題 (Row 7)
    const subHdr = ["開出時間", "八達通 9元", "八達通 6元", "現金 9元", "現金 6元", "單程金額"];
    subHdr.forEach((h, i) => {
        const cl = ws.getCell(7, i + 1);
        cl.value = h;
        cl.font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FFFFFFFF" } };
        cl.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FF1F497D" } };
        cl.alignment = { horizontal: 'center', vertical: 'middle' };
        cl.border = thinBorder();

        const cr = ws.getCell(7, i + 8);
        cr.value = h;
        cr.font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FFFFFFFF" } };
        cr.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FF1E7E34" } };
        cr.alignment = { horizontal: 'center', vertical: 'middle' };
        cr.border = thinBorder();
    });

    const totalLines = Math.max(leftData.length, rightData.length, 20);

    for (let i = 0; i < totalLines; i++) {
        const r = 8 + i;
        const l = leftData[i];
        const rt = rightData[i];

        if (l) {
            const rowAmt = (l.oct9 * 9) + (l.oct6 * 6) + (l.cash9 * 9) + (l.cash6 * 6);
            ws.getCell(`A${r}`).value = l.time;
            ws.getCell(`B${r}`).value = l.oct9;
            ws.getCell(`C${r}`).value = l.oct6;
            ws.getCell(`D${r}`).value = l.cash9;
            ws.getCell(`E${r}`).value = l.cash6;
            ws.getCell(`F${r}`).value = { formula: `(B${r}*9)+(C${r}*6)+(D${r}*9)+(E${r}*6)`, result: rowAmt };
        } else {
            ws.getCell(`F${r}`).value = { formula: `IF(OR(B${r}<>"",C${r}<>"",D${r}<>"",E${r}<>""),(N(B${r})*9)+(N(C${r})*6)+(N(D{r})*9)+(N(E{r})*6),"")`, result: 0 };
        }

        if (rt) {
            const rowAmtR = (rt.oct9 * 9) + (rt.oct6 * 6) + (rt.cash9 * 9) + (rt.cash6 * 6);
            ws.getCell(`H${r}`).value = rt.time;
            ws.getCell(`I${r}`).value = rt.oct9;
            ws.getCell(`J${r}`).value = rt.oct6;
            ws.getCell(`K${r}`).value = rt.cash9;
            ws.getCell(`L${r}`).value = rt.cash6;
            ws.getCell(`M${r}`).value = { formula: `(I${r}*9)+(J${r}*6)+(K${r}*9)+(L${r}*6)`, result: rowAmtR };
        } else {
            ws.getCell(`M${r}`).value = { formula: `IF(OR(I${r}<>"",J${r}<>"",K${r}<>"",L${r}<>""),(N(I{r})*9)+(N(J{r})*6)+(N(K{r})*9)+(N(L{r})*6),"")`, result: 0 };
        }

        const activeCols = ['A','B','C','D','E','F','H','I','J','K','L','M'];
        activeCols.forEach(col => {
            const cell = ws.getCell(`${col}${r}`);
            cell.font = { name: "Microsoft JhengHei", size: 10 };
            cell.border = thinBorder();
            cell.alignment = { horizontal: (col === 'F' || col === 'M') ? 'right' : 'center', vertical: 'middle' };
            if (i % 2 === 1) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFF9FAFB" } };
            if (col === 'F' || col === 'M') cell.numFmt = '$#,##0';
        });
    }

    // 5. 合計列 1: 人數合計
    const rTot = 8 + totalLines;

    ws.getCell(`A${rTot}`).value = "人數合計";
    ws.getCell(`A${rTot}`).font = { name: "Microsoft JhengHei", size: 10, bold: true };
    ws.getCell(`A${rTot}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`A${rTot}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
    ws.getCell(`A${rTot}`).border = totalBorder();

    const leftTotals = [leftOct9, leftOct6, leftCash9, leftCash6];
    ['B','C','D','E'].forEach((col, idx) => {
        const c = ws.getCell(`${col}${rTot}`);
        c.value = { formula: `SUM(${col}8:${col}${rTot-1})`, result: leftTotals[idx] };
        c.font = { name: "Microsoft JhengHei", size: 10, bold: true };
        c.alignment = { horizontal: 'center', vertical: 'middle' };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
        c.border = totalBorder();
        c.numFmt = '#,##0';
    });

    const leftTotalAmt = (leftOct9 * 9) + (leftOct6 * 6) + (leftCash9 * 9) + (leftCash6 * 6);
    const cTotL = ws.getCell(`F${rTot}`);
    cTotL.value = { formula: `SUM(F8:F${rTot-1})`, result: leftTotalAmt };
    cTotL.font = { name: "Microsoft JhengHei", size: 10, bold: true };
    cTotL.alignment = { horizontal: 'right', vertical: 'middle' };
    cTotL.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
    cTotL.border = totalBorder();
    cTotL.numFmt = '$#,##0';

    ws.getCell(`H${rTot}`).value = "人數合計";
    ws.getCell(`H${rTot}`).font = { name: "Microsoft JhengHei", size: 10, bold: true };
    ws.getCell(`H${rTot}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`H${rTot}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
    ws.getCell(`H${rTot}`).border = totalBorder();

    const rightTotals = [rightOct9, rightOct6, rightCash9, rightCash6];
    ['I','J','K','L'].forEach((col, idx) => {
        const c = ws.getCell(`${col}${rTot}`);
        c.value = { formula: `SUM(${col}8:${col}${rTot-1})`, result: rightTotals[idx] };
        c.font = { name: "Microsoft JhengHei", size: 10, bold: true };
        c.alignment = { horizontal: 'center', vertical: 'middle' };
        c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
        c.border = totalBorder();
        c.numFmt = '#,##0';
    });

    const rightTotalAmt = (rightOct9 * 9) + (rightOct6 * 6) + (rightCash9 * 9) + (rightCash6 * 6);
    const cTotR = ws.getCell(`M${rTot}`);
    cTotR.value = { formula: `SUM(M8:M${rTot-1})`, result: rightTotalAmt };
    cTotR.font = { name: "Microsoft JhengHei", size: 10, bold: true };
    cTotR.alignment = { horizontal: 'right', vertical: 'middle' };
    cTotR.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
    cTotR.border = totalBorder();
    cTotR.numFmt = '$#,##0';

    // 5. 合計列 2: 單線收入拆解
    const rSub = rTot + 1;
    ws.mergeCells(`A${rSub}:C${rSub}`);
    ws.getCell(`A${rSub}`).value = `西鐵線八達通: $${((leftOct9*9)+(leftOct6*6)).toLocaleString()}`;
    ws.getCell(`A${rSub}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`A${rSub}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFDDEBF7" } };
    ws.getCell(`A${rSub}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`D${rSub}:F${rSub}`);
    ws.getCell(`D${rSub}`).value = `西鐵線現金: $${((leftCash9*9)+(leftCash6*6)).toLocaleString()}`;
    ws.getCell(`D${rSub}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FFB25900" } };
    ws.getCell(`D${rSub}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFCE4D6" } };
    ws.getCell(`D${rSub}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`H${rSub}:J${rSub}`);
    ws.getCell(`H${rSub}`).value = `大棠線八達通: $${((rightOct9*9)+(rightOct6*6)).toLocaleString()}`;
    ws.getCell(`H${rSub}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FF1E7E34" } };
    ws.getCell(`H${rSub}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFE2EFDA" } };
    ws.getCell(`H${rSub}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`K${rSub}:M${rSub}`);
    ws.getCell(`K${rSub}`).value = `大棠線現金: $${((rightCash9*9)+(rightCash6*6)).toLocaleString()}`;
    ws.getCell(`K${rSub}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FFB25900" } };
    ws.getCell(`K${rSub}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFCE4D6" } };
    ws.getCell(`K${rSub}`).alignment = { horizontal: 'center', vertical: 'middle' };

    for (let c = 1; c <= 13; c++) {
        if (c !== 7) ws.getCell(rSub, c).border = thinBorder();
    }

    // 6. 全日對數結算總表 (4 大卡片 - 帶有明確數值與公式)
    const rBox = rTot + 3;

    ws.mergeCells(`A${rBox}:M${rBox}`);
    ws.getCell(`A${rBox}`).value = "【當日全日營運結算總表】";
    ws.getCell(`A${rBox}`).font = { name: "Microsoft JhengHei", size: 12, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`A${rBox}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`A${rBox}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFFF2CC" } };
    ws.getCell(`A${rBox}`).border = thinBorder();

    // 卡片 1: 八達通
    ws.mergeCells(`A${rBox+1}:C${rBox+1}`);
    ws.getCell(`A${rBox+1}`).value = "💳 八達通總收入 (自動入戶口)";
    ws.getCell(`A${rBox+1}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`A${rBox+1}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFDDEBF7" } };
    ws.getCell(`A${rBox+1}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`A${rBox+2}:C${rBox+2}`);
    ws.getCell(`A${rBox+2}`).value = { formula: `(B${rTot}+I${rTot})*9 + (C${rTot}+J${rTot})*6`, result: totalOctopusRev };
    ws.getCell(`A${rBox+2}`).font = { name: "Microsoft JhengHei", size: 16, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`A${rBox+2}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFDDEBF7" } };
    ws.getCell(`A${rBox+2}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`A${rBox+2}`).numFmt = '$#,##0';

    // 卡片 2: 現金 (司機交收)
    ws.mergeCells(`D${rBox+1}:F${rBox+1}`);
    ws.getCell(`D${rBox+1}`).value = "💵 現金總收入 (司機交收現金額)";
    ws.getCell(`D${rBox+1}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FFB25900" } };
    ws.getCell(`D${rBox+1}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFCE4D6" } };
    ws.getCell(`D${rBox+1}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`D${rBox+2}:F${rBox+2}`);
    ws.getCell(`D${rBox+2}`).value = { formula: `(D${rTot}+K${rTot})*9 + (E${rTot}+L${rTot})*6`, result: totalCashRev };
    ws.getCell(`D${rBox+2}`).font = { name: "Microsoft JhengHei", size: 16, bold: true, color: { argb: "FFB25900" } };
    ws.getCell(`D${rBox+2}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFFCE4D6" } };
    ws.getCell(`D${rBox+2}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`D${rBox+2}`).numFmt = '$#,##0';

    // 卡片 3: 總人數
    ws.mergeCells(`H${rBox+1}:J${rBox+1}`);
    ws.getCell(`H${rBox+1}`).value = "👥 當日總載客人次 (雙向合計)";
    ws.getCell(`H${rBox+1}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FF1E7E34" } };
    ws.getCell(`H${rBox+1}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFE2EFDA" } };
    ws.getCell(`H${rBox+1}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`H${rBox+2}:J${rBox+2}`);
    ws.getCell(`H${rBox+2}`).value = { formula: `SUM(B${rTot}:E${rTot})+SUM(I${rTot}:L${rTot})`, result: totalPassengers };
    ws.getCell(`H${rBox+2}`).font = { name: "Microsoft JhengHei", size: 16, bold: true, color: { argb: "FF1E7E34" } };
    ws.getCell(`H${rBox+2}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFE2EFDA" } };
    ws.getCell(`H${rBox+2}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`H${rBox+2}`).numFmt = '#,##0 人次';

    // 卡片 4: 全車總金額
    ws.mergeCells(`K${rBox+1}:M${rBox+1}`);
    ws.getCell(`K${rBox+1}`).value = "💰 全車總營業額 (八達通 + 現金)";
    ws.getCell(`K${rBox+1}`).font = { name: "Microsoft JhengHei", size: 10, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`K${rBox+1}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFDDEBF7" } };
    ws.getCell(`K${rBox+1}`).alignment = { horizontal: 'center', vertical: 'middle' };

    ws.mergeCells(`K${rBox+2}:M${rBox+2}`);
    ws.getCell(`K${rBox+2}`).value = { formula: `F${rTot}+M${rTot}`, result: grandTotalRev };
    ws.getCell(`K${rBox+2}`).font = { name: "Microsoft JhengHei", size: 16, bold: true, color: { argb: "FF1F497D" } };
    ws.getCell(`K${rBox+2}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: "FFDDEBF7" } };
    ws.getCell(`K${rBox+2}`).alignment = { horizontal: 'center', vertical: 'middle' };
    ws.getCell(`K${rBox+2}`).numFmt = '$#,##0';

    for (let rb = rBox + 1; rb <= rBox + 2; rb++) {
        for (let cb = 1; cb <= 13; cb++) {
            if (cb !== 7) ws.getCell(rb, cb).border = thinBorder();
        }
    }

    ws.columns = [
        { width: 13 }, { width: 12 }, { width: 12 }, { width: 11 }, { width: 11 }, { width: 14 },
        { width: 3 },
        { width: 13 }, { width: 12 }, { width: 12 }, { width: 11 }, { width: 11 }, { width: 14 }
    ];
}

function thinBorder() {
    return {
        top: { style: 'thin', color: { argb: 'FFB0C4DE' } },
        bottom: { style: 'thin', color: { argb: 'FFB0C4DE' } },
        left: { style: 'thin', color: { argb: 'FFB0C4DE' } },
        right: { style: 'thin', color: { argb: 'FFB0C4DE' } }
    };
}

function totalBorder() {
    return {
        top: { style: 'thin', color: { argb: 'FFB0C4DE' } },
        bottom: { style: 'double', color: { argb: 'FF1F497D' } },
        left: { style: 'thin', color: { argb: 'FFB0C4DE' } },
        right: { style: 'thin', color: { argb: 'FFB0C4DE' } }
    };
}

async function exportZipFiles() {
    try {
        showNotice('正在建立每日 Excel 並壓縮成 ZIP，請稍候...', 'info');
        const zip = new JSZip();
        const dates = Object.keys(dateGroups).sort();

        for (const d of dates) {
            const wb = new ExcelJS.Workbook();
            wb.creator = "浚鍵管理有限公司";
            const ws = wb.addWorksheet(`${d}記錄表`);
            populateDailySheet(ws, d, dateGroups[d]);
            const buf = await wb.xlsx.writeBuffer();
            zip.file(`行車記錄表_分拆對數版_${d}.xlsx`, buf);
        }

        const zipBlob = await zip.generateAsync({ type: "blob" });
        saveAs(zipBlob, `浚鍵管理_每日小巴行車記錄表_分拆對數版_${dates[0]}_至_${dates[dates.length-1]}.zip`);
        showNotice('🎉 ZIP 檔案已成功生成並開始下載！', 'success');
    } catch (err) {
        showNotice(`匯出失敗：${err.message}`, 'error');
    }
}

async function exportMonthlyWorkbook() {
    try {
        showNotice('正在生成全月多頁 Excel 檔案...', 'info');
        const wb = new ExcelJS.Workbook();
        wb.creator = "浚鍵管理有限公司";

        const dates = Object.keys(dateGroups).sort();
        for (const d of dates) {
            const ws = wb.addWorksheet(`${d.slice(5)}記錄表`);
            populateDailySheet(ws, d, dateGroups[d]);
        }

        const buf = await wb.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `浚鍵管理_全月小巴班次彙總表_分拆對數版_${dates[0]}_至_${dates[dates.length-1]}.xlsx`);
        showNotice('🎉 多分頁 Excel 已成功生成並開始下載！', 'success');
    } catch (err) {
        showNotice(`匯出失敗：${err.message}`, 'error');
    }
}

function showNotice(msg, type) {
    const box = document.getElementById('statusMsg');
    box.innerText = msg;
    box.className = `status-msg status-${type}`;
    box.style.display = 'block';
}
